# Dependabot proposes version updates as pull requests, which run the full CI checks before merge.
# Each waits 7 days after a release before proposing it, so a malicious or broken release can be
# withdrawn first; security updates are not delayed. Each package's ecosystem is added with the package.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: uv
    directory: /packages/api
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /packages/web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Node's types follow the Node version the package runs on (.nvmrc), not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # A TypeScript major is adopted on purpose, with the applications that use the package.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: uv
    directory: /packages/mock-idp
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /packages/mock-idp
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
