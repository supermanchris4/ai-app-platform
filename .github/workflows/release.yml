# Releases one package when its version tag is pushed: api-v{version}, web-v{version},
# mock-idp-v{version}, terraform-v{version} or workflows-v{version} (README, "Releasing"). The tag must
# name a commit on main and the version the package declares; the package's checks run again on the
# tagged commit before anything is published.
#
# - API platform: installed by uv from the tag; its wheel and source are attached to the release.
# - Web platform: published to GitHub Packages.
# - Mock identity provider: built, scanned with Trivy, and pushed to GitHub Container Registry.
# - Terraform modules: used by their git source at the commit the tag names, which the release records.
# - Reusable workflows: called at the tag's commit SHA, which the release records.
#
# The Terraform modules and the workflows declare no version in a file: their version is the latest
# entry in their changelog.
#
# Each publishes with this run's own token; no secret is stored.
name: Release

on:
  push:
    tags:
      - "api-v*"
      - "web-v*"
      - "mock-idp-v*"
      - "terraform-v*"
      - "workflows-v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      package: ${{ steps.match.outputs.package }}
      version: ${{ steps.match.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Match the tag to main and to the package's version
        id: match
        env:
          TAG: ${{ github.ref_name }}
        run: |
          declared() { python3 -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["project"]["version"])' "$1"; }
          latest() { grep -m1 -oP '^## \K\S+' "$1"; }
          case "$TAG" in
            api-v*) package=api; declared_in=packages/api/pyproject.toml; changelog=packages/api/CHANGELOG.md
              expected=$(declared "$declared_in") ;;
            web-v*) package=web; declared_in=packages/web/package.json; changelog=packages/web/CHANGELOG.md
              expected=$(node -p 'require("./packages/web/package.json").version') ;;
            mock-idp-v*) package=mock-idp; declared_in=packages/mock-idp/pyproject.toml; changelog=packages/mock-idp/CHANGELOG.md
              expected=$(declared "$declared_in") ;;
            terraform-v*) package=terraform; changelog=packages/terraform/CHANGELOG.md; declared_in=$changelog
              expected=$(latest "$changelog") ;;
            workflows-v*) package=workflows; changelog=.github/workflows/CHANGELOG.md; declared_in=$changelog
              expected=$(latest "$changelog") ;;
            *) echo "::error::$TAG is not a release tag"; exit 1 ;;
          esac
          version="${TAG#"$package"-v}"
          if [ "$version" != "$expected" ]; then
            echo "::error::$TAG names version $version, but $declared_in declares $expected"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG names a commit that is not on main"
            exit 1
          fi
          if ! grep -q "^## $version\b" "$changelog"; then
            echo "::error::$changelog has no entry for $version"
            exit 1
          fi
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  api-checks:
    name: API platform
    needs: version
    if: needs.version.outputs.package == 'api'
    permissions:
      contents: read
    uses: ./.github/workflows/python-checks.yml
    with:
      working-directory: packages/api
      test-command: uv run pytest --cov --cov-report=term
      postgres-image: postgres:17@sha256:31ba9c94a03ada9988f2bb493a22a75eef3a185884533e5cdbcd498ea835b08f
      postgres-setup-sql: packages/api/tests/database-users.sql
      database-prefix: ci

  api-release:
    name: Release the API platform
    needs: [version, api-checks]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        working-directory: packages/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Build the wheel and source
        run: uv build --out-dir dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "API platform $VERSION" \
            --notes "See [packages/api/CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/packages/api/CHANGELOG.md) and [how to install it](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/packages/api/README.md#installing-it)."

  web-checks:
    name: Web platform
    needs: version
    if: needs.version.outputs.package == 'web'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/web-checks.yml
    with:
      working-directory: packages/web

  web-release:
    name: Release the web platform
    needs: [version, web-checks]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    defaults:
      run:
        working-directory: packages/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GitHub Packages publishes an npm package only under its owner's scope, in lower case.
      - name: Match the package's scope to this repository's owner
        id: package
        run: |
          scope="@${GITHUB_REPOSITORY_OWNER,,}"
          name=$(node -p 'require("./package.json").name')
          if [ "${name%%/*}" != "$scope" ]; then
            echo "::error::package.json names $name, but this repository's owner publishes only under $scope"
            exit 1
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: packages/web/.nvmrc
          registry-url: https://npm.pkg.github.com
          scope: ${{ steps.package.outputs.scope }}

      - name: Install from the lock file
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: npm publish --ignore-scripts

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
          PACKAGE: ${{ steps.package.outputs.name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Web platform $VERSION" \
            --notes "Published as \`$PACKAGE@$VERSION\` in GitHub Packages. See [packages/web/CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/packages/web/CHANGELOG.md) and [how to install it](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/packages/web/README.md#installing-it)."

  mock-idp-checks:
    name: Mock identity provider
    needs: version
    if: needs.version.outputs.package == 'mock-idp'
    permissions:
      contents: read
    uses: ./.github/workflows/python-checks.yml
    with:
      working-directory: packages/mock-idp

  mock-idp-release:
    name: Release the mock identity provider
    needs: [version, mock-idp-checks]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      # Trivy 0.76.1, as in image-checks.yml.
      TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The image is named after this repository's owner, in lower case as the registry requires,
      # and its source label links it to this repository.
      - name: Build
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ai-app-platform-mock-idp"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build --tag "$IMAGE:$VERSION" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" packages/mock-idp

      - name: Scan
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE:$VERSION"

      - name: Push to GitHub Container Registry
        id: push
        env:
          TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          echo "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$VERSION"
          docker logout ghcr.io
          echo "digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$VERSION")" >> "$GITHUB_OUTPUT"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Mock identity provider $VERSION" \
            --notes "Published as \`$IMAGE:$VERSION\`, digest \`$DIGEST\`. See [packages/mock-idp/CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/packages/mock-idp/CHANGELOG.md) and [how to use it](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/packages/mock-idp/README.md#using-it)."

  terraform-checks:
    name: Terraform modules
    needs: version
    if: needs.version.outputs.package == 'terraform'
    permissions:
      contents: read
    uses: ./.github/workflows/terraform-checks.yml
    with:
      root: packages/terraform
      configurations: |
        packages/terraform/modules/*
      scan-path: packages/terraform

  terraform-release:
    name: Release the Terraform modules
    needs: [version, terraform-checks]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Terraform modules $VERSION" \
            --notes "Use them at commit \`$GITHUB_SHA\` # $TAG. See [packages/terraform/CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/packages/terraform/CHANGELOG.md) and [how to use them](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/packages/terraform/README.md#using-a-module)."

  workflows-checks:
    name: Workflows
    needs: version
    if: needs.version.outputs.package == 'workflows'
    permissions:
      contents: read
    uses: ./.github/workflows/workflow-checks.yml

  workflows-release:
    name: Release the reusable workflows
    needs: [version, workflows-checks]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Reusable workflows $VERSION" \
            --notes "Call them at commit \`$GITHUB_SHA\` # $TAG. See [.github/workflows/CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/.github/workflows/CHANGELOG.md) and [how to call them](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/.github/workflows/README.md#calling-a-workflow)."
