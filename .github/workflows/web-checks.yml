# Checks a Node web interface: lint and format check, type check, unit tests and build, then its
# end-to-end journeys and accessibility checks against a stack started on the runner
# (the template's 13-delivery-pipeline.md). Reusable: it holds nothing of one application,
# and takes its values as inputs.
name: Web checks

on:
  workflow_call:
    inputs:
      github-packages-scope:
        description: An npm scope whose packages come from GitHub Packages, such as "@example", read with the run's own token; empty for none
        type: string
        default: ""
      working-directory:
        description: The web interface's directory, holding package.json and package-lock.json
        type: string
        required: true
      lint-command:
        description: The command that lints and checks formatting
        type: string
        default: npm run lint
      typecheck-command:
        description: The command that type checks
        type: string
        default: npm run typecheck
      test-command:
        description: The command that runs the unit tests
        type: string
        default: npm test
      build-command:
        description: The command that builds the app
        type: string
        default: npm run build
      e2e-stack-command:
        description: The command that starts the stack the end-to-end tests run against; empty for no end-to-end tests
        type: string
        default: ""
      e2e-command:
        description: The command that runs the end-to-end tests
        type: string
        default: npx playwright test

permissions: {}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Reads packages from GitHub Packages, when github-packages-scope names a scope.
      packages: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.working-directory }}/.nvmrc
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
          registry-url: ${{ inputs.github-packages-scope != '' && 'https://npm.pkg.github.com' || '' }}
          scope: ${{ inputs.github-packages-scope }}

      - name: Install from the lock file
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

      - name: Lint and format check
        env:
          COMMAND: ${{ inputs.lint-command }}
        run: bash -c "$COMMAND"

      - name: Type check
        env:
          COMMAND: ${{ inputs.typecheck-command }}
        run: bash -c "$COMMAND"

      - name: Unit tests
        env:
          COMMAND: ${{ inputs.test-command }}
        run: bash -c "$COMMAND"

      - name: Build
        env:
          COMMAND: ${{ inputs.build-command }}
        run: bash -c "$COMMAND"

      - name: Start the end-to-end stack
        if: inputs.e2e-stack-command != ''
        env:
          COMMAND: ${{ inputs.e2e-stack-command }}
        run: bash -c "$COMMAND"

      - name: Install the browser
        if: inputs.e2e-stack-command != ''
        run: npx playwright install --with-deps chromium

      - name: End-to-end and accessibility tests
        if: inputs.e2e-stack-command != ''
        env:
          COMMAND: ${{ inputs.e2e-command }}
        run: bash -c "$COMMAND"

      - name: Keep the end-to-end report
        if: failure() && inputs.e2e-stack-command != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            ${{ inputs.working-directory }}/playwright-report
            ${{ inputs.working-directory }}/test-results
          retention-days: 7
