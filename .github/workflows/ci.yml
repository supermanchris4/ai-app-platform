# The pull request checks, required to pass before merge (the template's 13-delivery-pipeline.md).
# Each package's checks join as the package is moved in. A check's name in the ruleset,
# .github/rulesets/main.json, is "{job name} / {reusable workflow's job name}".
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security:
    name: Security
    permissions:
      contents: read
    uses: ./.github/workflows/security-checks.yml
    with:
      lockfiles: |
        packages/api/uv.lock
        packages/web/package-lock.json

  api:
    name: API platform
    permissions:
      contents: read
    uses: ./.github/workflows/python-checks.yml
    with:
      working-directory: packages/api
      # The coverage threshold is in pyproject.toml.
      test-command: uv run pytest --cov --cov-report=term
      postgres-image: postgres:17@sha256:31ba9c94a03ada9988f2bb493a22a75eef3a185884533e5cdbcd498ea835b08f
      postgres-setup-sql: packages/api/tests/database-users.sql
      database-prefix: ci

  web:
    name: Web platform
    permissions:
      contents: read
    uses: ./.github/workflows/web-checks.yml
    with:
      working-directory: packages/web
