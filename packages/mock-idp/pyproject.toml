[project]
name = "ai-app-platform-mock-idp"
version = "0.1.0"
description = "Local mock OpenID Connect provider for applications built from the AI application template. Never deployed."
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.118.0",
    "uvicorn>=0.30.0",
    "pyjwt[crypto]>=2.10.0",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.26.0",
    "ruff>=0.14.0",
    "pyright[nodejs]>=1.1.400",
]

[tool.uv]
package = false
# Packages published in the last 7 days are not resolved, so a malicious or broken release can be
# withdrawn before it is used.
exclude-newer = "7 days"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "PL"]
ignore = ["PLR0913", "PLR0917"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
include = ["mock_idp.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
