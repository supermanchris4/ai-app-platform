[project]
name = "ai-app-platform"
version = "0.1.1"
description = "The API platform for applications built from the AI application template: settings, logging, database access, middleware, authentication, sign-in, audit and error handling for FastAPI"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.121.0",  # Depends(scope=...), which the database session dependency uses
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "alembic>=1.13.0",
    "pyjwt[crypto]>=2.10.0",
    "httpx>=0.28.0",
    "boto3>=1.43.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.14.0",
    "pyright[nodejs]>=1.1.400",
    "boto3-stubs[secretsmanager]>=1.43.0",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv]
# Packages published in the last 7 days are not resolved, so a malicious or broken release can be
# withdrawn before it is used.
exclude-newer = "7 days"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "PL"]
ignore = [
    "PLR0913", # FastAPI routes take one argument per dependency and parameter
    "PLR0917",
    "PLR0911",
    "PLR0912",
    "PLR0915",
]

[tool.ruff.lint.isort]
known-first-party = ["ai_app_platform"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "PLR2004", # literal values in assertions are the point of a test
    "PLC0415", # fixtures import inside functions to keep test modules independent
]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
# The tests are run and linted; strict typing is for the package code, as in the applications.
include = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["ai_app_platform"]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
